name: oligo_design

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # Direct dependency versions; this is not a transitive/build lockfile.
  # See supplementary/software_versions.md for provenance and validation.
  - r-base=4.5.1
  - r-pak=0.9.0
  - r-xml=3.99_0.20
  # Keep stringi's compiled library compatible with Conda's ICU runtime.
  - r-stringi=1.8.7
  - bioconductor-rmelting=1.26.0

  - oligoarrayaux=3.8.1
  - bowtie=1.3.1
  - viennarna=2.7.2
  - ucsc-fatotwobit=482
  - ucsc-twobittofa=482
  - openjdk=21.0.8

  - c-compiler=1.11.0
  - cxx-compiler=1.11.0
  - fortran-compiler=1.11.0
  - make=4.4.1
  # fs builds its bundled libuv with CMake during pak installation.
  - cmake>=3.10
  - pkg-config=0.29.2
